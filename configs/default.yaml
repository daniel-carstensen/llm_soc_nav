seed: 42

paths:
  raw:
    baby_names: data/raw/Popular_Baby_Names.csv
    tasks: data/raw/son_et_al_nhb_2024_nav_problems.csv
  names_dir: data/names
  prompts_dir: data/prompts
  results_dir: /users/dlcarste/data/llm_soc_nav/results

prompt_generation:
  random_name_count: 500
  n_prompt_sets: 100

name_token_check:
  local_files_only: false
  random_candidate_multiplier: 500
  family_tokenizers:
    gemma3: google/gemma-3-4b-it
    gemma4: google/gemma-4-E2B-it
    mistral-small3.2: mistralai/Mistral-Small-3.2-24B-Instruct-2506
    ministral-3: mistralai/Ministral-3-14B-Instruct-2512
    qwen3: Qwen/Qwen3-8B
    qwen3.5: Qwen/Qwen3.5-4B
    deepseek-r1: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    gpt-oss: openai/gpt-oss-20b

prompt_conditions:
  - id: graph-social_names-baby
    graph_context: social
    name_source: baby_names
  - id: graph-social_names-random
    graph_context: social
    name_source: random_strings
  - id: graph-generic_names-baby
    graph_context: generic
    name_source: baby_names
  - id: graph-generic_names-random
    graph_context: generic
    name_source: random_strings

random_walk_generation:
  prefix_lengths: [0, 1, 2, 3, 5, 8]

model_groups:
  instruct_llm:
    # - gemma3:4b
    - gemma3:12b
    - gemma3:27b
    # - name: gemma4:31b
    #   label: gemma4-31b-no-think
    #   prompt_prefix: "/no_think"
    #   options:
    #     temperature: 0
    #     top_p: 0
    #     top_k: 1
    #     think: false
    # - name: gemma4:e4b
    #   label: gemma4-e4b-no-think
    #   prompt_prefix: "/no_think"
    #   options:
    #     temperature: 0
    #     top_p: 0
    #     top_k: 1
    #     think: false
    - llama3.1:8b
    # - mistral-nemo:latest 
    # - mistral-small:22b
    - mistral-small3.2:24b
    # - ministral-3:14b
    # - mixtral:latest
    # - name: qwen3.5:4b  
    #   label: qwen3.5-4b-no-think
    #   prompt_prefix: "/no_think"
    #   options:
    #     temperature: 0
    #     top_p: 0
    #     top_k: 1
    #     think: false
    # - name: qwen3.5:9b
    #   label: qwen3.5-9b-no-think
    #   prompt_prefix: "/no_think"
    #   options:
    #     temperature: 0
    #     top_p: 0
    #     top_k: 1
    #     think: false
    # - name: qwen3:8b
    #   label: qwen3-8b-no-think
    #   prompt_prefix: "/no_think"
    #   options:
    #     temperature: 0
    #     top_p: 0
    #     top_k: 1
    #     think: false
  reasoning_llm:
    - name: qwen3:8b
      label: qwen3-8b
      options:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0
        presence_penalty: 1.5
        repetition_penalty: 1
        think: true
    - name: qwen3.5:9b
      label: qwen3.5-9b
      options:
        temperature: 1
        top_p: 0.95
        top_k: 20
        min_p: 0
        presence_penalty: 1.5
        repetition_penalty: 1.0
        think: true
    - name: gemma4:e4b
      label: gemma4-e4b
      options:
        temperature: 1
        top_p: 0.95
        top_k: 64
        think: true
    - name: deepseek-r1:7b
      label: deepseek-r1-7b
      options:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        think: true
    - name: gpt-oss:20b
      label: gpt-oss-20b
      options:
        temperature: 1
        top_p: 0.95
        top_k: 20
        think: medium

generation:
  top_logprobs: 20
  llm-classifier:
    num_predict: 12
    logprobs: true
    options:
      temperature: 0
      top_p: 0
      top_k: 1
      seed: 42
      stop: ["\n", "\t", ".", ",", ";", ":", "!", "?", "\"", "'"]
  llm-path:
    num_predict: 24
    logprobs: true
    options:
      seed: 42
  llm-next-node:
    num_predict: 12
    logprobs: true
    options:
      temperature: 0
      top_p: 0
      top_k: 1
      seed: 42
      stop: ["\n", "\t", ".", ",", ";", ":", "!", "?", "\"", "'"]

run_matrices:
  classifier:
    model_groups: [instruct_llm, reasoning_llm]
    prompt_conditions: [graph-social_names-baby, graph-social_names-random, graph-generic_names-baby, graph-generic_names-random]
    llm_instruct: llm-classifier
    search_instructs: [search-base]
    output_label: llm-classifier
  path:
    model_groups: [instruct_llm, reasoning_llm]
    prompt_conditions: [graph-social_names-baby, graph-social_names-random, graph-generic_names-baby, graph-generic_names-random]
    llm_instruct: llm-path
    search_instructs: [search-base]
    output_label: llm-path
  path_search:
    model_groups: [reasoning_llm]
    prompt_conditions: [graph-social_names-baby, graph-social_names-random]
    llm_instruct: llm-path
    search_instructs: [search-bfs, search-sr-low-gamma, search-sr-medium-gamma, search-sr-high-gamma]
    output_label: llm-path
  next_node:
    model_groups: [instruct_llm]
    prompt_conditions: [graph-social_names-baby, graph-social_names-random, graph-generic_names-baby, graph-generic_names-random]
    llm_instruct: llm-next-node
    search_instructs: [search-random-walk]
    output_label: llm-next-node

run_groups:
  classifier_runs:
    - classifier
  classifier_instruct_runs:
    - matrix: classifier
      model_group: instruct_llm
  classifier_reasoning_runs:
    - matrix: classifier
      model_group: reasoning_llm
  classifier_graph-social_names-baby_runs:
    - matrix: classifier
      prompt_condition: graph-social_names-baby
  classifier_instruct_graph-social_names-baby_runs:
    - matrix: classifier
      model_group: instruct_llm
      prompt_condition: graph-social_names-baby
  classifier_reasoning_graph-social_names-baby_runs:
    - matrix: classifier
      model_group: reasoning_llm
      prompt_condition: graph-social_names-baby
  path_runs:
    - path
  path_instruct_runs:
    - matrix: path
      model_group: instruct_llm
  path_reasoning_runs:
    - matrix: path
      model_group: reasoning_llm
  path_graph-social_names-baby_runs:
    - matrix: path
      prompt_condition: graph-social_names-baby
  path_instruct_graph-social_names-baby_runs:
    - matrix: path
      model_group: instruct_llm
      prompt_condition: graph-social_names-baby
  path_reasoning_graph-social_names-baby_runs:
    - matrix: path
      model_group: reasoning_llm
      prompt_condition: graph-social_names-baby
  path_search_runs:
    - path_search
  path_search_graph-social_names-baby_runs:
    - matrix: path_search
      prompt_condition: graph-social_names-baby
  instruct_llm_runs:
    - matrix: classifier
      model_group: instruct_llm
    - matrix: path
      model_group: instruct_llm
    - next_node
  next_node_runs:
    - next_node
  reasoning_llm_runs:
    - matrix: classifier
      model_group: reasoning_llm
    - matrix: path
      model_group: reasoning_llm
    - path_search
  all:
    - classifier
    - path
    - path_search
    - next_node

seed: 42

paths:
  raw:
    baby_names: data/raw/Popular_Baby_Names.csv
    tasks: data/raw/son_et_al_nhb_2024_nav_problems.csv
  prompts_dir: data/prompts
  results_dir: /users/dlcarste/data/llm_soc_nav/results

prompt_generation:
  random_name_count: 1000
  n_prompt_sets: 100

prompt_conditions:
  - id: graph-social_names-baby
    graph_context: social
    name_source: baby_names
  - id: graph-social_names-random
    graph_context: social
    name_source: random_strings
  - id: graph-generic_names-baby
    graph_context: generic
    name_source: baby_names
  - id: graph-generic_names-random
    graph_context: generic
    name_source: random_strings

random_walk_generation:
  prefix_lengths: [0, 1, 2, 3, 5, 8]

model_groups:
  instruct_llm:
    - gemma3:4b
    - gemma3:12b
    - gemma3:27b
    - mistral-small3.2:24b
    - name: qwen3:8b
      label: qwen3-8b-no-think
      prompt_prefix: "/no_think\n\n"
      options:
        temperature: 0
        top_p: 0
        top_k: 1
  reasoning_llm:
    - name: qwen3:8b
      label: qwen3-8b
      options:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
    - name: deepseek-r1:7b
      label: deepseek-r1-7b
      options:
        temperature: 0.6
        top_p: 0.95
        top_k: 20

generation:
  top_logprobs: 64
  llm-classifier:
    num_predict: 12
    logprobs: true
    options:
      temperature: 0
      top_p: 0
      top_k: 1
      seed: 42
      stop: ["\n", " ", "\t", ".", ",", ";", ":", "!", "?", "\"", "'"]
  llm-path:
    num_predict: 1024
    logprobs: false
    options:
      seed: 42
  llm-next-node:
    num_predict: 12
    logprobs: true
    options:
      temperature: 0
      top_p: 0
      top_k: 1
      seed: 42
      stop: ["\n", " ", "\t", ".", ",", ";", ":", "!", "?", "\"", "'"]

run_matrices:
  classifier:
    model_groups: [instruct_llm, reasoning_llm]
    prompt_conditions: [graph-social_names-baby, graph-social_names-random, graph-generic_names-baby, graph-generic_names-random]
    llm_instruct: llm-classifier
    search_instructs: [search-base]
    output_label: llm-classifier
  path:
    model_groups: [instruct_llm, reasoning_llm]
    prompt_conditions: [graph-social_names-baby, graph-social_names-random, graph-generic_names-baby, graph-generic_names-random]
    llm_instruct: llm-path
    search_instructs: [search-base]
    output_label: llm-path
  path_search:
    model_groups: [reasoning_llm]
    prompt_conditions: [graph-social_names-baby, graph-social_names-random]
    llm_instruct: llm-path
    search_instructs: [search-bfs, search-sr-low-gamma, search-sr-medium-gamma, search-sr-high-gamma]
    output_label: llm-path
  next_node:
    model_groups: [instruct_llm]
    prompt_conditions: [graph-social_names-baby, graph-social_names-random, graph-generic_names-baby, graph-generic_names-random]
    llm_instruct: llm-next-node
    search_instructs: [search-random-walk]
    output_label: llm-next-node

run_groups:
  classifier_runs:
    - classifier
  path_runs:
    - path
  path_search_runs:
    - path_search
  instruct_llm_runs:
    - matrix: classifier
      model_group: instruct_llm
    - matrix: path
      model_group: instruct_llm
    - next_node
  next_node_runs:
    - next_node
  reasoning_llm_runs:
    - matrix: classifier
      model_group: reasoning_llm
    - matrix: path
      model_group: reasoning_llm
    - path_search
  all:
    - classifier
    - path
    - path_search
    - next_node

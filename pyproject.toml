[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-soc-nav"
version = "0.1.0"
description = "Minimal research tools for LLM social network navigation experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.5",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "sentencepiece>=0.2",
    "transformers>=4.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_soc_nav"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
